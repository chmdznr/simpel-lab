services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: labqa
      RABBITMQ_DEFAULT_PASS: labqa-only
    ports:
      - "127.0.0.1:5763:5672"
      - "127.0.0.1:15683:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labqa
      POSTGRES_PASSWORD: labqa-only
      POSTGRES_DB: labqa
    ports:
      - "127.0.0.1:5463:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labqa -d labqa"]
      interval: 2s
      timeout: 5s
      retries: 30
