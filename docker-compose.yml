# SIMPEL Lab - infrastruktur pendukung praktik.
#
# Yang WAJIB hidup di Hari 1 hanya layanan "rabbitmq" dan "postgres".
# Prometheus + Grafana baru dipakai di MP-9 (Hari 5), boleh dimatikan lebih dulu:
#   docker compose up -d rabbitmq postgres

services:
  # ---------------------------------------------------------------------------
  # Message broker. Ini bintang utama seluruh pelatihan.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management
    container_name: simpel-rabbitmq
    hostname: simpel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-simpel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-simpel123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"     # port AMQP, dipakai kode Node.js
      - "${RABBITMQ_UI_PORT:-15672}:15672" # Management UI di browser
      - "15692:15692"                      # metrik Prometheus
    volumes:
      # Mengaktifkan plugin management + prometheus tanpa perlu masuk container.
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Database. Sengaja kecil: layanan "validasi" akan menghantamnya (sumber LI-2).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: simpel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simpel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simpel123}
      POSTGRES_DB: ${POSTGRES_DB:-simpel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Skrip di folder ini otomatis dijalankan saat container pertama kali dibuat.
      - ./db:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    command:
      # Batas koneksi sengaja rendah supaya efek "DB kehabisan napas" terlihat
      # di Lab 3d ketika konsumen paralel tanpa prefetch menghantam bersamaan.
      - "postgres"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simpel} -d ${POSTGRES_DB:-simpel}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Observability. Baru dipakai MP-9. Aman dimatikan kalau RAM laptop pas-pasan.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: simpel-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - rabbitmq

  grafana:
    image: grafana/grafana:11.3.0
    container_name: simpel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  rabbitmq-data:
  postgres-data:
  grafana-data:
